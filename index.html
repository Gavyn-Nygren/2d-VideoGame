<meta charset="utf-8">
<title>Pip &amp; Bo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<div id="app">
  <header class="bar">
    <div class="brand" aria-label="Pip and Bo"><span class="pip">Pip</span> <span class="amp">&amp;</span> <span class="bo">Bo</span></div>
    <div class="legend" aria-label="Controls">
      <span class="kb-only" data-legp="0"><b class="nm-pip">Pip</b> <span data-leg="pip"><kbd>A</kbd><kbd>D</kbd> move <kbd>W</kbd> jump <kbd>S</kbd> drop</span><em class="acth"><kbd>F</kbd> <span data-actlabel>act</span></em></span>
      <span class="kb-only" data-legp="1"><b class="nm-bo">Bo</b> <span data-leg="bo"><kbd>←</kbd><kbd>→</kbd> move <kbd>↑</kbd> jump <kbd>↓</kbd> drop</span><em class="acth"><kbd>/</kbd> <span data-actlabel>act</span></em></span>
      <span class="kb-only"><kbd>R</kbd> restart <kbd>Esc</kbd> pause</span>
      <span class="pad-only">Controller: <span data-leg="pad">stick or d-pad move, <span data-glyph="a"></span> jump, down drops,</span><em class="acth"><span data-glyph="act"></span> <span data-actlabel>act</span>,</em> <span data-glyph="start"></span> pause</span>
    </div>
    <div class="bar-actions">
      <button class="chipbtn" id="muteBtn" type="button" aria-pressed="false">Sound on</button>
      <button class="chipbtn" id="menuBtn" type="button">Menu</button>
    </div>
  </header>
  <p class="rotate-tip">Turn your device sideways for a bigger screen.</p>
  <main class="stage-wrap" id="stageWrap">
    <div class="stage" id="stage">
      <canvas id="game" width="960" height="540" aria-label="Pip and Bo game screen"></canvas>
    </div>
    <div class="tpad pip" id="padPip" aria-hidden="true">
      <div class="tbtn tact" data-p="0" data-k="jump">▲</div>
      <div class="tbtn tact" data-p="0" data-k="down">▼</div>
      <div class="tbtn tact tbtn-act" data-p="0" data-k="act" data-actlabel>act</div>
      <div class="tmove" data-p="0"><div class="tbtn" data-k="left">◀</div><div class="tbtn" data-k="right">▶</div></div>
    </div>
    <div class="tpad bo" id="padBo" aria-hidden="true">
      <div class="tbtn tact" data-p="1" data-k="down">▼</div>
      <div class="tbtn tact" data-p="1" data-k="jump">▲</div>
      <div class="tbtn tact tbtn-act" data-p="1" data-k="act" data-actlabel>act</div>
      <div class="tmove" data-p="1"><div class="tbtn" data-k="left">◀</div><div class="tbtn" data-k="right">▶</div></div>
    </div>
    <div class="overlay" id="overlay" hidden></div>
    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  </main>
</div>
